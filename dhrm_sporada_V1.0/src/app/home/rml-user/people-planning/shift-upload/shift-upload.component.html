<div class="mx-2">
         <!-- header -->
  <div class="!flex !items-center gap-2 py-2 !justify-between !shadow-md !my-4 !rounded-md !mx-auto !px-4 !font-poppins border border-gray-400 h-auto flex-col md:flex-row md:!h-20">
    <div class="flex items-start justify-start flex-col">
      <h1 class="!text-[1.5rem] !font-semibold flex items-center justify-center gap-2 text-blue-600">
      <mat-icon>today</mat-icon> Shift Upload<hr/>
    </h1>
    <p class="mt-1 text-gray-400">Download and Upload Shift</p>
    </div>
    <!-- user details -->
         <h1 class="!text-[1.25rem] !font-semibold flex items-center justify-center gap-2 text-blue-600 float-right">
          {{userDetails}}
         </h1>
  </div>

   <!-- actions  -->
  <div class="!shadow-md !my-4 !rounded-md !mx-auto h-full pb-3 !px-4 !font-poppins sm:h-40 border border-gray-400 ">
    <!-- action header -->
      <div class="relative">
        <h1 class="!text-[1.3rem] !font-semibold gap-1 text-blue-600 flex items-center justify-start mt-2">
          Actions <mat-icon>filter_alt</mat-icon>
          <span _ngcontent-xtd-c575="" class="bg-blue-200 rounded-md px-2 py-1 text-base"> Total Count: {{sheetJsonData.length}}</span>
        </h1>
      </div>
    <!-- actions divison -->
     <div class="flex items-center justify-start w-full flex-col sm:flex-row sm:gap-2">
     <!-- file select -->
     <div class="w-full sm:w-1/3">
      <label for="date" class="font-semibold text-gray-400 mb-1 mt-3">Excel File</label> <br>
     <input type="file" (change)="onFileChange($event)" #fileInput class="block w-full text-sm text-gray-500 file:me-4 file:py-2 file:px-4 file:!rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:disabled:opacity-50 file:disabled:pointer-events-none dark:text-neutral-500 dark:file:bg-blue-500 dark:hover:file:bg-blue-400">
     </div>
     <!-- clear file input -->
      <div class="mt-8 ml-3">
      <p-button 
        icon="pi pi-times"
        styleClass="rounded-xl mt-2 bg-red-400 border-red-400 hover:!bg-red-500 hover:!border-red-500"
        (onClick)="clearFileInput()"  
      >
     </p-button> 
     </div>
       <!-- download template -->
     <div class="mt-8 ml-3">
      <p-button 
        icon="pi pi-download"
        styleClass="rounded-xl mt-2"
        (onClick)="download()"
        label="Download Template"  
      >
     </p-button> 
     </div>
       <!-- upload -->
     <div class="mt-8 ml-3">
      <p-button 
        icon="pi pi-upload"
        label="Upload"
        styleClass="rounded-xl mt-2 "
        (onClick)="upload()"  
      >
     </p-button> 
     </div>
     </div>
  </div>
   
  <!-- table data UI -->
   <div class="h-[90svh] lg:h-[80vh] xl:h-[78vh] sm:h-[75vh] shadow-md rounded-md border border-gray-400 overflow-y-scroll  mx-2">
  <table id="table" class="table-auto !w-full">
      <!-- table head -->
      <thead class="sticky top-0">
        <tr class="!border-none !border-0 !shadow !my-4 !bg-blue-600 !font-poppins text-center xl:!text-left" *ngIf="!file">
          <th class="!text-white !rounded-s-lg !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>  
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>
          <th class="!text-white !px-2 !py-4 !border-none !border-0 text-center"></th>  
          <th class="!text-white !rounded-e-lg !px-2 !py-4 !border-none !border-0 text-center"></th>
        </tr>
        <tr class="!border-none !border-0 !shadow !my-4 !bg-blue-600 !font-poppins text-center xl:!text-left">
            <th [ngClass]="idx === 0 
              ? 'tableFirstHeader' 
              : (idx === sheetHeaders.length - 1) 
              ? 'tableLastHeader'
              : 'tableMidHeaders'"
              *ngFor="let header of sheetHeaders; let idx = index;">
            {{header}}
          </th>
           </tr>
      </thead>
      <!-- table body -->
      <tbody>
        <tr *ngFor="let item of sheetJsonData;let i=index" class="!border-none !border-0 !hover:bg-blue-200 !font-poppins cursor-pointer">
          <td 
           class="tableRowData font-bold" 
           [ngClass]="item[header] == 'A' 
           ? 'text-green-600 text-center' 
           : item[header] == 'B' 
           ? 'text-purple-600 text-center' 
           : item[header] == 'C' 
           ? 'text-orange-500 text-center' 
           : item[header] == 'W' 
           ? 'text-blue-600 text-center' 
           : ''"
          *ngFor="let header of sheetHeaders">
          {{item[header]}}
        </td>

  </div>
